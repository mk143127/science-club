function sc2DateString(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function sc2DaysUntil(dateString) {
  if (!dateString) {
    return null;
  }

  const target = parseDate(dateString);

  if (!target) {
    return null;
  }

  const today = new Date();

  today.setHours(0, 0, 0, 0);

  return Math.ceil(
    (target - today) / 86400000
  );
}


function sc2PrettyDateTime(value) {
  if (!value) {
    return "";
  }

  return new Date(value).toLocaleString();
}

async function sc2StartPractice() {

  const category =
    document
      .getElementById(
        "sc2PracticeCategory"
      )
      .value || null;


  const difficulty =
    document
      .getElementById(
        "sc2PracticeDifficulty"
      )
      .value || null;


  const limit =
    Number(
      document
        .getElementById(
          "sc2PracticeLimit"
        )
        .value
    ) || 10;


  const {
    data,
    error
  } =
    await db.rpc(
      "get_practice_questions",
      {
        p_category:
          category,

        p_difficulty:
          difficulty,

        p_limit:
          limit
      }
    );


  if (error) {

    console.error(error);

    msg(
      "sc2PracticeMsg",
      "Could not load practice questions.",
      "err"
    );

    return;

  }


  SC2.practiceSet =
    data || [];


  if (
    !SC2.practiceSet.length
  ) {

    msg(
      "sc2PracticeMsg",
      "No published questions match those filters yet.",
      "err"
    );

    return;

  }


  document
    .getElementById(
      "sc2PracticeCard"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "sc2PracticeMeta"
    )
    .textContent =
    `${SC2.practiceSet.length} question${
      SC2.practiceSet.length === 1
        ? ""
        : "s"
    }`;


  document
    .getElementById(
      "sc2PracticeQuestions"
    )
    .innerHTML =
    SC2.practiceSet
      .map(
        (question, index) => `

          <div class="question">

            <h3>
              ${index + 1}.
              ${esc(
                question.question_text
              )}
            </h3>


            ${[
              "A",
              "B",
              "C",
              "D"
            ]
              .map(
                letter => `

                  <label
                    class="option"
                  >

                    <input
                      type="radio"
                      name="sc2_practice_${question.id}"
                      value="${letter}"
                      required
                    >


                    <span>
                      <b>
                        ${letter}.
                      </b>

                      ${esc(
                        question[
                          "option_" +
                          letter.toLowerCase()
                        ]
                      )}
                    </span>

                  </label>
                `
              )
              .join("")}

          </div>
        `
      )
      .join("");


  document
    .getElementById(
      "sc2PracticeResults"
    )
    .innerHTML =
    "";
}


async function sc2GradePractice(
  event
) {

  event.preventDefault();


  if (
    !SC2.practiceSet.length
  ) {
    return;
  }


  const answers = {};


  for (
    const question
    of SC2.practiceSet
  ) {

    const selected =
      document.querySelector(
        `input[name="sc2_practice_${question.id}"]:checked`
      );


    if (!selected) {

      msg(
        "sc2PracticeMsg",
        "Answer every question first.",
        "err"
      );

      return;

    }


    answers[
      String(question.id)
    ] =
      selected.value;
  }


  const {
    data,
    error
  } =
    await db.rpc(
      "grade_practice_questions",
      {
        p_question_ids:
          SC2.practiceSet
            .map(
              question =>
                question.id
            ),

        p_answers:
          answers
      }
    );


  if (error) {

    console.error(error);

    msg(
      "sc2PracticeMsg",
      "Could not grade this practice set.",
      "err"
    );

    return;
  }


  const percentage =
    data.total
      ? Math.round(
          data.score /
          data.total *
          100
        )
      : 0;


  document
    .getElementById(
      "sc2PracticeResults"
    )
    .innerHTML = `

      <div
        class="sc2-feedback ${
          percentage >= 70
            ? "good"
            : "bad"
        }"
      >
        <b>
          ${data.score}/${data.total}
          (${percentage}%)
        </b>
      </div>


      ${
        (data.results || [])
          .map(
            (result, index) => `

              <div
                class="review ${
                  result.correct
                    ? "good"
                    : "bad"
                }"
              >

                <b>
                  Question ${index + 1}:
                  ${
                    result.correct
                      ? "Correct"
                      : "Incorrect"
                  }
                </b>

                <br>

                Your answer:
                ${esc(
                  result.your_answer ||
                  "—"
                )}

                • Correct:
                ${esc(
                  result.correct_option
                )}

                ${
                  result.explanation
                    ? `
                      <br>

                      <span class="muted">
                        ${esc(
                          result.explanation
                        )}
                      </span>
                    `
                    : ""
                }

              </div>
            `
          )
          .join("")
      }
    `;
}

async function sc2LoadFlashcards() {

  if (
    !currentUser ||
    currentProfile?.role !==
      "student"
  ) {
    return;
  }


  const [
    deckResult,
    cardResult
  ] =
    await Promise.all([

      db
        .from(
          "flashcard_decks"
        )
        .select("*")
        .order(
          "sort_order",
          {
            ascending:
              true
          }
        ),

      db
        .from(
          "flashcards"
        )
        .select("*")
        .order(
          "sort_order",
          {
            ascending:
              true
          }
        )

    ]);


  if (
    deckResult.error
  ) {
    console.error(
      deckResult.error
    );
  }


  if (
    cardResult.error
  ) {
    console.error(
      cardResult.error
    );
  }


  SC2.flashDecks =
    deckResult.data || [];


  SC2.flashcards =
    cardResult.data || [];


  sc2RenderDecks();
}


function sc2RenderDecks() {

  const list =
    document.getElementById(
      "sc2DeckList"
    );


  list.innerHTML =
    SC2.flashDecks.length

      ? SC2.flashDecks
          .map(
            deck => {

              const count =
                SC2.flashcards
                  .filter(
                    card =>
                      Number(
                        card.deck_id
                      ) ===
                      Number(
                        deck.id
                      )
                  )
                  .length;


              return `

                <div class="sc2-card">

                  <span class="badge">
                    ${esc(
                      deck.category
                    )}
                  </span>


                  <h3>
                    ${esc(
                      deck.title
                    )}
                  </h3>


                  <p class="muted">
                    ${esc(
                      deck.description ||
                      "Review deck"
                    )}

                    <br>

                    ${count}
                    card${
                      count === 1
                        ? ""
                        : "s"
                    }
                  </p>


                  <button
                    class="primary sc2OpenDeck"
                    data-id="${deck.id}"
                  >
                    Study Deck
                  </button>

                </div>
              `;
            }
          )
          .join("")

      : `
        <p class="muted">
          No published flashcard
          decks yet.
        </p>
      `;


  document
    .querySelectorAll(
      ".sc2OpenDeck"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            sc2OpenDeck(
              Number(
                button.dataset.id
              )
            )
        );

      }
    );
}


function sc2OpenDeck(id) {

  SC2.activeDeck =
    SC2.flashDecks
      .find(
        deck =>
          Number(deck.id) ===
          Number(id)
      );


  SC2.activeCards =
    SC2.flashcards
      .filter(
        card =>
          Number(
            card.deck_id
          ) ===
          Number(id)
      );


  SC2.activeCardIndex = 0;

  SC2.showingBack = false;


  if (!SC2.activeDeck) {
    return;
  }


  document
    .getElementById(
      "sc2DeckListCard"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "sc2StudyCard"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "sc2StudyTitle"
    )
    .textContent =
    SC2.activeDeck.title;


  sc2RenderCard();
}


function sc2FlashKey() {

  return (
    "scienceClubFlash:" +
    (
      currentUser?.id ||
      "anonymous"
    ) +
    ":" +
    (
      SC2.activeDeck?.id ||
      0
    )
  );
}


function sc2RenderCard() {

  if (
    !SC2.activeCards.length
  ) {

    document
      .getElementById(
        "sc2FlashText"
      )
      .textContent =
      "This deck has no cards yet.";


    document
      .getElementById(
        "sc2StudyMeta"
      )
      .textContent =
      "0 cards";


    return;
  }


  const card =
    SC2.activeCards[
      SC2.activeCardIndex
    ];


  document
    .getElementById(
      "sc2FlashLabel"
    )
    .textContent =
    SC2.showingBack
      ? "ANSWER"
      : "QUESTION";


  document
    .getElementById(
      "sc2FlashText"
    )
    .textContent =
    SC2.showingBack
      ? card.back_text
      : card.front_text;


  let stats = {
    got: 0,
    again: 0
  };


  try {

    stats =
      JSON.parse(
        localStorage.getItem(
          sc2FlashKey()
        )
      ) ||
      stats;

  } catch (_) {
  }


  document
    .getElementById(
      "sc2StudyMeta"
    )
    .textContent =

    `Card ${
      SC2.activeCardIndex + 1
    } of ${
      SC2.activeCards.length
    } • Got It ${
      stats.got || 0
    } • Again ${
      stats.again || 0
    }`;


  document
    .getElementById(
      "sc2FlashPrev"
    )
    .disabled =
    SC2.activeCardIndex === 0;


  document
    .getElementById(
      "sc2FlashNext"
    )
    .disabled =
    SC2.activeCardIndex ===
    SC2.activeCards.length - 1;
}


function sc2FlipCard() {

  SC2.showingBack =
    !SC2.showingBack;


  sc2RenderCard();
}


function sc2MoveCard(
  direction
) {

  const next =
    SC2.activeCardIndex +
    direction;


  if (
    next < 0 ||
    next >=
      SC2.activeCards.length
  ) {
    return;
  }


  SC2.activeCardIndex =
    next;


  SC2.showingBack =
    false;


  sc2RenderCard();
}


function sc2RateCard(
  kind
) {

  let stats = {
    got: 0,
    again: 0
  };


  try {

    stats =
      JSON.parse(
        localStorage.getItem(
          sc2FlashKey()
        )
      ) ||
      stats;

  } catch (_) {
  }


  stats[kind] =
    (stats[kind] || 0) +
    1;


  localStorage.setItem(
    sc2FlashKey(),
    JSON.stringify(stats)
  );


  if (
    SC2.activeCardIndex <
    SC2.activeCards.length -
    1
  ) {

    SC2.activeCardIndex++;

    SC2.showingBack =
      false;
  }


  sc2RenderCard();
}


/* =========================================================
   DAILY CHALLENGE
   ========================================================= */

async function sc2LoadDailyChallenge() {

  if (
    !currentUser ||
    currentProfile?.role !==
      "student"
  ) {
    return;
  }


  const [
    challengeResult,
    answerResult
  ] =
    await Promise.all([

      db.rpc(
        "get_daily_challenge",
        {
          p_date:
            sc2DateString()
        }
      ),

      db
        .from(
          "daily_challenge_answers"
        )
        .select(
          "challenge_id,answer,is_correct,answered_at"
        )
        .eq(
          "user_id",
          currentUser.id
        )

    ]);


  if (
    challengeResult.error
  ) {
    console.error(
      challengeResult.error
    );
  }


  if (
    answerResult.error
  ) {
    console.error(
      answerResult.error
    );
  }


  SC2.dailyChallenge =
    (
      challengeResult.data ||
      []
    )[0] ||
    null;


  SC2.dailyAnswer =
    SC2.dailyChallenge
      ? (
          answerResult.data ||
          []
        )
          .find(
            answer =>
              Number(
                answer.challenge_id
              ) ===
              Number(
                SC2.dailyChallenge.id
              )
          )
      : null;


  sc2RenderDaily();
}


function sc2RenderDaily() {

  const box =
    document.getElementById(
      "sc2DailyContent"
    );


  if (
    !SC2.dailyChallenge
  ) {

    box.innerHTML = `
      <p class="muted">
        There is no published
        challenge for today yet.
      </p>
    `;

    return;
  }


  const question =
    SC2.dailyChallenge;


  box.innerHTML = `

    <h2>
      ${esc(
        question.question_text
      )}
    </h2>


    <form
      id="sc2DailyForm"
    >

      ${[
        "A",
        "B",
        "C",
        "D"
      ]
        .map(
          letter => `

            <label
              class="sc2-daily-option"
            >

              <input
                type="radio"
                name="sc2DailyAnswer"
                value="${letter}"
                ${
                  SC2.dailyAnswer
                    ?.answer ===
                  letter
                    ? "checked"
                    : ""
                }
                required
              >


              <span>
                <b>
                  ${letter}.
                </b>

                ${esc(
                  question[
                    "option_" +
                    letter.toLowerCase()
                  ]
                )}
              </span>

            </label>
          `
        )
        .join("")}


      <button
        class="primary"
        type="submit"
      >
        ${
          SC2.dailyAnswer
            ? "Check Again"
            : "Submit Answer"
        }
      </button>

    </form>


    <div
      id="sc2DailyFeedback"
    >
    </div>
  `;


  document
    .getElementById(
      "sc2DailyForm"
    )
    .addEventListener(
      "submit",
      sc2SubmitDaily
    );


  if (
    SC2.dailyAnswer
  ) {

    const feedback =
      document.getElementById(
        "sc2DailyFeedback"
      );


    feedback.className =
      "sc2-feedback " +
      (
        SC2.dailyAnswer
          .is_correct
          ? "good"
          : "bad"
      );


    feedback.textContent =
      SC2.dailyAnswer
        .is_correct
        ? "Your latest answer was correct."
        : "Your latest answer was not correct. You can try again.";
  }
}


async function sc2SubmitDaily(
  event
) {

  event.preventDefault();


  const selected =
    document.querySelector(
      'input[name="sc2DailyAnswer"]:checked'
    );


  if (
    !selected ||
    !SC2.dailyChallenge
  ) {
    return;
  }


  const {
    data,
    error
  } =
    await db.rpc(
      "submit_daily_challenge",
      {
        p_challenge_id:
          SC2.dailyChallenge.id,

        p_answer:
          selected.value
      }
    );


  if (error) {

    console.error(error);

    msg(
      "sc2DailyMsg",
      "Could not submit your answer.",
      "err"
    );

    return;
  }


  SC2.dailyAnswer = {

    challenge_id:
      SC2.dailyChallenge.id,

    answer:
      selected.value,

    is_correct:
      !!data.correct

  };


  const feedback =
    document.getElementById(
      "sc2DailyFeedback"
    );


  feedback.className =
    "sc2-feedback " +
    (
      data.correct
        ? "good"
        : "bad"
    );


  feedback.innerHTML = `

    <b>
      ${
        data.correct
          ? "Correct!"
          : "Not quite."
      }
    </b>

    Correct answer:
    ${esc(
      data.correct_option
    )}

    ${
      data.explanation
        ? `
          <br>
          ${esc(
            data.explanation
          )}
        `
        : ""
    }
  `;


  await sc2LoadProgress();
}

  const [
    notificationResult,
    readResult
  ] =
    await Promise.all([

      db
        .from(
          "notifications"
        )
        .select("*")
        .order(
          "created_at",
          {
            ascending:
              false
          }
        ),

      db
        .from(
          "notification_reads"
        )
        .select(
          "notification_id,read_at"
        )
        .eq(
          "user_id",
          currentUser.id
        )

    ]);


  if (
    notificationResult.error
  ) {
    console.error(
      notificationResult.error
    );
  }


  if (
    readResult.error
  ) {
    console.error(
      readResult.error

  SC2.notifications =

  SC2.notificationReads =

    [];


  sc2RenderNotifications();

function sc2IsRead(id) {

  return (
    SC2.notificationReads
      .some(
        read =>
          Number(
            read.notification_id
          ) ===
          Number(id)
      )
  );
}


function sc2RenderNotifications() {

  const unread =
    SC2.notifications
      .filter(
        notification =>
          !sc2IsRead(
            notification.id
          )
      )
      .length;


  document
    .getElementById(
      "sc2NotificationCount"
    )
    .textContent =
    unread;


  const list =
    document.getElementById(
      "sc2NotificationList"
    );


  list.innerHTML =
    SC2.notifications.length

      ? SC2.notifications
          .map(
            notification => `

              <div
                class="sc2-notification ${
                  sc2IsRead(
                    notification.id
                  )
                    ? ""
                    : "unread"
                }"
              >

                <div
                  class="sc2-notification-dot"
                >
                </div>


                <div class="grow">

                  <h3
                    style="
                      margin:0 0 4px;
                      font-size:12px
                    "
                  >
                    ${esc(
                      notification.title
                    )}
                  </h3>


                  <p
                    class="muted"
                    style="margin:0"
                  >
                    ${esc(
                      notification.message
                    )}
                  </p>


                  <div
                    class="sc2-meta"
                  >
                    ${esc(
                      notification.category
                    )}

                    •

                    ${sc2PrettyDateTime(
                      notification.created_at
                    )}
                  </div>


                  <div
                    class="sc2-actions"
                  >

                    ${
                      !sc2IsRead(
                        notification.id
                      )
                        ? `
                          <button
                            class="secondary sc2MarkRead"
                            data-id="${notification.id}"
                            type="button"
                          >
                            Mark Read
                          </button>
                        `
                        : ""
                    }


                    ${
                      notification.link_page
                        ? `
                          <button
                            class="primary sc2OpenNotification"
                            data-id="${notification.id}"
                            data-page="${esc(
                              notification.link_page
                            )}"
                            type="button"
                          >
                            Open
                          </button>
                        `
                        : ""
                    }

                  </div>

                </div>

              </div>
            `
          )
          .join("")

      : `
        <p class="muted">
          No notifications yet.
        </p>
      `;


  document
    .querySelectorAll(
      ".sc2MarkRead"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            sc2MarkRead(
              Number(
                button.dataset.id
              )
            )
        );

      }
    );


  document
    .querySelectorAll(
      ".sc2OpenNotification"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            await sc2MarkRead(
              Number(
                button.dataset.id
              )
            );


            const page =
              button.dataset.page;


            if (
              pages[page]
            ) {
              showPage(page);
              return;
            }


            if (
              page === "wwsef"
            ) {
              showPage(
                "sc2WWSEF"
              );
            }


            if (
              page ===
              "questionbank"
            ) {
              showPage(
                "sc2QuestionBank"
              );
            }


            if (
              page ===
              "flashcards"
            ) {
              showPage(
                "sc2Flashcards"
              );
            }


            if (
              page ===
              "daily"
            ) {
              showPage(
                "sc2Daily"
              );
            }

          }
        );

      }
    );
}


async function sc2MarkRead(
  id
) {

  const {
    error
  } =
    await db
      .from(
        "notification_reads"
      )
      .upsert(
        {
          notification_id:
            id,

          user_id:
            currentUser.id
        },
        {
          onConflict:
            "notification_id,user_id"
        }
      );


  if (error) {

    console.error(error);

    msg(
      "sc2NotificationMsg",
      "Could not update notification.",
      "err"
    );

    return;
  }


  await sc2LoadNotifications();
}


async function sc2MarkAllRead() {

  const unread =
    SC2.notifications
      .filter(
        notification =>
          !sc2IsRead(
            notification.id
          )
      );


  if (!unread.length) {

    msg(
      "sc2NotificationMsg",
      "Everything is already marked read."
    );

    return;
  }


  const rows =
    unread.map(
      notification => ({
        notification_id:
          notification.id,

        user_id:
          currentUser.id
      })
    );


  const {
    error
  } =
    await db
      .from(
        "notification_reads"
      )
      .upsert(
        rows,
        {
          onConflict:
            "notification_id,user_id"
        }
      );


  if (error) {

    console.error(error);

    msg(
      "sc2NotificationMsg",
      "Could not mark notifications read.",
      "err"
    );

    return;
  }


  await sc2LoadNotifications();
}

  const patch = {

        )

function sc2RenderMilestones() {

  const list =
    document.getElementById(
      "sc2Milestones"
    );


  list.innerHTML =
    SC2.milestones.length

      ? SC2.milestones
          .map(
            milestone => `

              <div
                class="sc2-milestone ${
                  milestone.is_complete
                    ? "done"
                    : ""
                }"
              >

                <input
                  class="sc2MilestoneToggle"
                  data-id="${milestone.id}"
                  type="checkbox"
                  ${
                    milestone.is_complete
                      ? "checked"
                      : ""
                  }
                >


                <div class="grow">

                  <div
                    class="sc2-milestone-title"
                  >
                    ${esc(
                      milestone.title
                    )}
                  </div>


                  <div
                    class="sc2-meta"
                  >

                    ${
                      milestone.due_date
                        ? "Due " +
                          parseDate(
                            milestone.due_date
                          )
                            .toLocaleDateString()
                        : "No due date"
                    }

                    ${
                      milestone.details
                        ? " • " +
                          esc(
                            milestone.details
                          )
                        : ""
                    }

                  </div>

                </div>


                <button
                  class="danger sc2DeleteMilestone"
                  data-id="${milestone.id}"
                  type="button"
                >
                  Delete
                </button>

              </div>
            `
          )
          .join("")

      : `
        <p class="muted">
          No milestones yet.
        </p>
      `;


  document
    .querySelectorAll(
      ".sc2MilestoneToggle"
    )
    .forEach(
      checkbox => {

        checkbox.addEventListener(
          "change",
          () =>
            sc2ToggleMilestone(
              Number(
                checkbox.dataset.id
              ),
              checkbox.checked
            )
        );

      }
    );


  document
    .querySelectorAll(
      ".sc2DeleteMilestone"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            sc2DeleteMilestone(
              Number(
                button.dataset.id
              )
            )
        );

      }
    );


  const total =
    SC2.milestones.length;


  const completed =
    SC2.milestones
      .filter(
        milestone =>
          milestone.is_complete
      )
      .length;


  const percentage =
    total
      ? Math.round(
          completed /
          total *
          100
        )
      : 0;


  document
    .getElementById(
      "sc2ProjectProgressBar"
    )
    .style.width =
    percentage + "%";


  document
    .getElementById(
      "sc2ProjectProgressText"
    )
    .textContent =
    `${completed} of ${total} milestones complete • ${percentage}%`;


  const next =
    SC2.milestones
      .filter(
        milestone =>
          !milestone.is_complete &&
          milestone.due_date
      )
      .sort(
        (a, b) =>
          a.due_date
            .localeCompare(
              b.due_date
            )
      )[0];


  const date =
    next?.due_date ||
    SC2.activeProject
      ?.target_date;


  const days =
    sc2DaysUntil(date);


  const countdown =
    document.getElementById(
      "sc2Countdown"
    );


  if (next) {

    countdown.innerHTML = `

      <strong>
        ${
          days < 0
            ? Math.abs(days) +
              " days overdue"
            : days +
              " days"
        }
      </strong>

      <br>

      <span class="muted">
        Next milestone:
        ${esc(
          next.title
        )}

        •

        ${parseDate(
          next.due_date
        ).toLocaleDateString()}
      </span>
    `;

  } else if (date) {

    countdown.innerHTML = `

      <strong>
        ${
          days < 0
            ? Math.abs(days) +
              " days past"
            : days +
              " days"
        }
      </strong>

      <br>

      <span class="muted">
        Until project target date
        •

        ${parseDate(
          date
        ).toLocaleDateString()}
      </span>
    `;

  } else {

    countdown.textContent =
      "Add a milestone due date to start the countdown.";
  }
}

/* =========================================================
   PROGRESS + ACHIEVEMENTS
   ========================================================= */

async function sc2LoadProgress() {

  if (
    !currentUser ||
    currentProfile?.role !==
      "student"
  ) {
    return;
  }


  const publishedModules =
    (modules || [])
      .filter(
        module =>
          module.is_published
      );


  const activityCalls =
    await Promise.all(
      publishedModules
        .map(
          module =>
            db.rpc(
              "get_module_activities",
              {
                p_module_id:
                  module.id
              }
            )
        )
    );


  const allActivities = [];


  activityCalls
    .forEach(
      (result, index) => {

        if (
          result.error
        ) {

          console.error(
            result.error
          );

          return;
        }


        (
          result.data ||
          []
        )
          .forEach(
            activity => {

              allActivities.push({
                ...activity,

                module_id:
                  publishedModules[
                    index
                  ].id
              });

            }
          );

      }
    );


  const [
    progressResult,
    quizResult,
    dailyResult,
    notebookResult,
    milestoneResult
  ] =
    await Promise.all([

      db
        .from(
          "module_progress"
        )
        .select(
          "module_id,activity_id,is_complete"
        )
        .eq(
          "user_id",
          currentUser.id
        ),

      db
        .from(
          "quiz_attempts"
        )
        .select(
          "score,total_questions"
        )
        .eq(
          "user_id",
          currentUser.id
        ),

      db
        .from(
          "daily_challenge_answers"
        )
        .select(
          "is_correct"
        )
        .eq(
          "user_id",
          currentUser.id
        ),

      db
        .from(
          "lab_notebook_entries"
        )
        .select("id"),

      db
        .from(
          "wwsef_milestones"
        )
        .select(
          "id,is_complete"
        )

    ]);


  const progress =
    progressResult.data ||
    [];


  const attempts =
    quizResult.data ||
    [];


  const daily =
    dailyResult.data ||
    [];


  const notebook =
    notebookResult.data ||
    [];


  const milestones =
    milestoneResult.data ||
    [];


  const completedActivities =
    allActivities
      .filter(
        activity =>
          progress.some(
            row =>
              Number(
                row.activity_id
              ) ===
              Number(
                activity.id
              ) &&
              row.is_complete
          )
      )
      .length;


  const modulePercentage =
    allActivities.length
      ? Math.round(
          completedActivities /
          allActivities.length *
          100
        )
      : 0;


  let modulesDone = 0;


  for (
    const module
    of publishedModules
  ) {

    const activities =
      allActivities
        .filter(
          activity =>
            Number(
              activity.module_id
            ) ===
            Number(
              module.id
            )
        );


    if (
      activities.length &&
      activities.every(
        activity =>
          progress.some(
            row =>
              Number(
                row.activity_id
              ) ===
              Number(
                activity.id
              ) &&
              row.is_complete
          )
      )
    ) {
      modulesDone++;
    }
  }


  const quizAverage =
    attempts.length
      ? Math.round(

          attempts.reduce(
            (
              total,
              attempt
            ) =>
              total +
              (
                attempt.total_questions
                  ? (
                      100 *
                      attempt.score /
                      attempt.total_questions
                    )
                  : 0
              ),
            0
          ) /

          attempts.length
        )
      : null;


  if (
    !SC2.projects.length
  ) {
    await sc2LoadProjects();
  }


  let projectPercentage =
    null;


  if (
    SC2.projects.length
  ) {

    const {
      data
    } =
      await db
        .from(
          "wwsef_milestones"
        )
        .select(
          "is_complete"
        )
        .eq(
          "project_id",
          SC2.projects[0].id
        );


    const rows =
      data || [];


    projectPercentage =
      rows.length
        ? Math.round(
            rows.filter(
              row =>
                row.is_complete
            ).length /
            rows.length *
            100
          )
        : 0;
  }


  const perfectQuiz =
    attempts.some(
      attempt =>
        attempt.total_questions >
          0 &&
        attempt.score ===
          attempt.total_questions
    );


  const badges = [

    {
      icon:
        "🔬",

      name:
        "Science Club Starter",

      description:
        "Open your first shared resource.",

      unlocked:
        (studentActivity || [])
          .length >=
        1
    },

    {
      icon:
        "📘",

      name:
        "Module Explorer",

      description:
        "Complete your first CCC module.",

      unlocked:
        modulesDone >=
        1
    },

    {
      icon:
        "🧪",

      name:
        "CCC Learner",

      description:
        "Complete three CCC modules.",

      unlocked:
        modulesDone >=
        3
    },

    {
      icon:
        "🎯",

      name:
        "Perfect Reaction",

      description:
        "Earn 100% on a CCC quiz.",

      unlocked:
        perfectQuiz
    },

    {
      icon:
        "🧠",

      name:
        "Daily Solver",

      description:
        "Answer a Daily Challenge correctly.",

      unlocked:
        daily.some(
          row =>
            row.is_correct
        )
    },

    {
      icon:
        "🚀",

      name:
        "WWSEF Researcher",

      description:
        "Create or join a WWSEF project.",

      unlocked:
        SC2.projects.length >=
        1
    },

    {
      icon:
        "📓",

      name:
        "Lab Notetaker",

      description:
        "Add a digital lab notebook entry.",

      unlocked:
        notebook.length >=
        1
    },

    {
      icon:
        "✅",

      name:
        "Milestone Maker",

      description:
        "Complete a WWSEF milestone.",

      unlocked:
        milestones.some(
          row =>
            row.is_complete
        )
    },

    {
      icon:
        "📚",

      name:
        "Resource Researcher",

      description:
        "Open five Science Club resources.",

      unlocked:
        (studentActivity || [])
          .length >=
        5
    }

  ];


  const parts = [];


  if (
    allActivities.length
  ) {
    parts.push(
      modulePercentage
    );
  }


  if (
    quizAverage !== null
  ) {
    parts.push(
      quizAverage
    );
  }


  if (
    projectPercentage !==
      null
  ) {
    parts.push(
      projectPercentage
    );
  }


  const overall =
    parts.length
      ? Math.round(
          parts.reduce(
            (a, b) =>
              a + b,
            0
          ) /
          parts.length
        )
      : 0;


  document
    .getElementById(
      "sc2OverallPct"
    )
    .textContent =
    overall + "%";


  document
    .getElementById(
      "sc2OverallBar"
    )
    .style.width =
    overall + "%";


  document
    .getElementById(
      "sc2OverallText"
    )
    .textContent =
    "Based on modules" +
    (

/* =========================================================
   CHEMISTRY CALCULATORS
   ========================================================= */

function sc2ParseFormula(
  formula
) {

  formula =
    String(
      formula || ""
    )
      .replace(
        /\s+/g,
        ""
      );


  if (!formula) {
    throw new Error(
      "Enter a formula."
    );
  }


  let index = 0;


  function parseNumber() {

    const match =
      formula
        .slice(index)
        .match(
          /^(\d+(?:\.\d+)?)/
        );


    if (!match) {
      return 1;
    }


    index +=
      match[1].length;


    return Number(
      match[1]
    );
  }


  function parseSection(
    stopCharacter
  ) {

    const counts = {};


    while (
      index <
      formula.length
    ) {

      if (
        stopCharacter &&
        formula[index] ===
          stopCharacter
      ) {

        index++;

        return counts;
      }


      if (
        formula[index] ===
        "("
      ) {

        index++;


        const inner =
          parseSection(
            ")"
          );


        const multiplier =
          parseNumber();


        for (
          const [
            symbol,
            count
          ]
          of Object.entries(
            inner
          )
        ) {

          counts[symbol] =
            (
              counts[symbol] ||
              0
            ) +
            count *
            multiplier;
        }


        continue;
      }


      const match =
        formula
          .slice(index)
          .match(
            /^([A-Z][a-z]?)/
          );


      if (!match) {

        throw new Error(
          `Could not read the formula near "${formula.slice(index)}".`
        );
      }


      const symbol =
        match[1];


      if (
        !(
          symbol in
          SC2_ATOMIC_MASS
        )
      ) {

        throw new Error(
          `Unknown element symbol: ${symbol}`
        );
      }


      index +=
        symbol.length;


      const count =
        parseNumber();


      counts[symbol] =
        (
          counts[symbol] ||
          0
        ) +
        count;
    }


    if (stopCharacter) {

      throw new Error(
        "Missing closing parenthesis."
      );
    }


    return counts;
  }


  return parseSection(
    null
  );
}


function sc2FormulaMass(
  formula
) {

  const counts =
    sc2ParseFormula(
      formula
    );


  const mass =
    Object.entries(
      counts
    )
      .reduce(
        (
          total,
          [
            symbol,
            count
          ]
        ) =>
          total +
          (
            SC2_ATOMIC_MASS[
              symbol
            ] *
            count
          ),
        0
      );


  return {
    counts,
    mass
  };
}


function sc2WireChemTools() {

  document
    .getElementById(
      "sc2MolarForm"
    )
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();


        try {

          const result =
            sc2FormulaMass(
              document
                .getElementById(
                  "sc2MolarFormula"
                )
                .value
            );


          document
            .getElementById(
              "sc2MolarResult"
            )
            .innerHTML =

            `Molar mass =
             <b>
               ${result.mass.toFixed(3)}
               g/mol
             </b>
             <br>` +

            Object.entries(
              result.counts
            )
              .map(
                ([
                  symbol,
                  count
                ]) =>
                  `${symbol}: ${count}`
              )
              .join(" • ");


        } catch (error) {

          document
            .getElementById(
              "sc2MolarResult"
            )
            .textContent =
            error.message;
        }

      }
    );


  document
    .getElementById(
      "sc2MolesForm"
    )
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();


        try {

          const molarMass =
            sc2FormulaMass(
              document
                .getElementById(
                  "sc2MolesFormula"
                )
                .value
            ).mass;


          const value =
            Number(
              document
                .getElementById(
                  "sc2MolesValue"
                )
                .value
            );


          const mode =
            document
              .getElementById(
                "sc2MolesMode"
              )
              .value;


          if (
            !Number.isFinite(
              value
            )
          ) {

            throw new Error(
              "Enter a valid number."
            );
          }


          document
            .getElementById(
              "sc2MolesResult"
            )
            .innerHTML =

            mode ===
            "massToMoles"

              ? `
                <b>
                  ${
                    (
                      value /
                      molarMass
                    )
                      .toPrecision(6)
                  }
                  mol
                </b>
              `

              : `
                <b>
                  ${
                    (
                      value *
                      molarMass
                    )
                      .toPrecision(6)
                  }
                  g
                </b>
              `;


        } catch (error) {

          document
            .getElementById(
              "sc2MolesResult"
            )
            .textContent =
            error.message;
        }

      }
    );


  document
    .getElementById(
      "sc2CompositionForm"
    )
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();


        try {

          const result =
            sc2FormulaMass(
              document
                .getElementById(
                  "sc2CompositionFormula"
                )
                .value
            );


          document
            .getElementById(
              "sc2CompositionResult"
            )
            .innerHTML =

            Object.entries(
              result.counts
            )
              .map(
                ([
                  symbol,
                  count
                ]) => {

                  const percentage =
                    (
                      100 *
                      SC2_ATOMIC_MASS[
                        symbol
                      ] *
                      count /
                      result.mass
                    )
                      .toFixed(2);


                  return (
                    `${symbol}: ` +
                    `<b>${percentage}%</b>`
                  );
                }
              )
              .join("<br>") +

            `<br>
             Total molar mass:
             ${result.mass.toFixed(3)}
             g/mol`;


        } catch (error) {

          document
            .getElementById(
              "sc2CompositionResult"
            )
            .textContent =
            error.message;
        }

      }
    );


  document
    .getElementById(
      "sc2DilutionForm"
    )
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();


        const unknown =
          document
            .getElementById(
              "sc2DilutionUnknown"
            )
            .value;


        const values = {

          c1:
            Number(
              document
                .getElementById(
                  "sc2C1"
                )
                .value
            ),

          v1:
            Number(
              document
                .getElementById(
                  "sc2V1"
                )
                .value
            ),

          c2:
            Number(
              document
                .getElementById(
                  "sc2C2"
                )
                .value
            ),

          v2:
            Number(
              document
                .getElementById(
                  "sc2V2"
                )
                .value
            )

        };


        const required =
          Object.keys(
            values
          )
            .filter(
              key =>
                key !== unknown
            );


        if (
          required.some(
            key =>
              !Number.isFinite(
                values[key]
              ) ||
              values[key] === 0
          )
        ) {

          document
            .getElementById(
              "sc2DilutionResult"
            )
            .textContent =
            "Enter non-zero values for the other three fields.";

          return;
        }


        let answer;


        if (
          unknown === "c1"
        ) {

          answer =
            values.c2 *
            values.v2 /
            values.v1;
        }


        if (
          unknown === "v1"
        ) {

          answer =
            values.c2 *
            values.v2 /
            values.c1;
        }


        if (
          unknown === "c2"
        ) {

          answer =
            values.c1 *
            values.v1 /
            values.v2;
        }


        if (
          unknown === "v2"
        ) {

          answer =
            values.c1 *
            values.v1 /
            values.c2;
        }


        document
          .getElementById(
            "sc2DilutionResult"
          )
          .innerHTML =

          `${unknown.toUpperCase()}
           =
           <b>
             ${answer.toPrecision(6)}
           </b>`;

      }
    );


  document
    .getElementById(
      "sc2UnitForm"
    )
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();


        const value =
          Number(
            document
              .getElementById(
                "sc2UnitValue"
              )
              .value
          );


        const mode =
          document
            .getElementById(
              "sc2UnitMode"
            )
            .value;


        if (
          !Number.isFinite(
            value
          )
        ) {
          return;
        }


        const conversions = {

          gkg:
            [
              value / 1000,
              "kg"
            ],

          kgg:
            [
              value * 1000,
              "g"
            ],

          mlL:
            [
              value / 1000,
              "L"
            ],

          Lml:
            [
              value * 1000,
              "mL"
            ],

          kPaatm:
            [
              value / 101.325,
              "atm"
            ],

          atmkPa:
            [
              value * 101.325,
              "kPa"
            ],

          cK:
            [
              value + 273.15,
              "K"
            ],

          Kc:
            [
              value - 273.15,
              "°C"
            ]
        };


        const result =
          conversions[
            mode
          ];


        document
          .getElementById(
            "sc2UnitResult"
          )
          .innerHTML =

          `<b>
             ${result[0].toPrecision(7)}
             ${result[1]}
           </b>`;

      }
    );


  document
    .getElementById(
      "sc2SigForm"
    )
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();


        try {

          let value =
            document
              .getElementById(
                "sc2SigValue"
              )
              .value
              .trim()
              .replace(
                /^[+-]/,
                ""
              );


          if (
            !/^((\d+\.?\d*)|(\.\d+))([eE][+-]?\d+)?$/
              .test(value)
          ) {

            throw new Error(
              "Enter a valid written number."
            );
          }


          value =
            value.split(
              /[eE]/
            )[0];


          let count;


          if (
            value.includes(".")
          ) {

            const digits =
              value
                .replace(
                  ".",
                  ""
                )
                .replace(
                  /^0+/,
                  ""
                );


            count =
              digits.length ||
              1;

          } else {

            const digits =
              value
                .replace(
                  /^0+/,
                  ""
                )
                .replace(
                  /0+$/,
                  ""
                );


            count =
              digits.length ||
              1;
          }


          document
            .getElementById(
              "sc2SigResult"
            )
            .innerHTML =

            `<b>
               ${count}
             </b>
             significant figure${
               count === 1
                 ? ""
                 : "s"
             }.`;

        } catch (error) {

          document
            .getElementById(
              "sc2SigResult"
            )
            .textContent =
            error.message;
        }

      }
    );
}

async function sc2LoadAdmin() {

  if (
    !currentUser ||
    currentProfile?.role !==
      "admin"
  ) {
    return;
  }


  const [
    practiceResult,
    deckResult,
    cardResult,
    dailyResult,
    projectResult,
    teamResult,
    memberResult,
    notificationResult
  ] =
    await Promise.all([

      db
        .from(
          "practice_questions"
        )
        .select("*")
        .order(
          "created_at",
          {
            ascending:
              false
          }
        ),

      db
        .from(
          "flashcard_decks"
        )
        .select("*")
        .order(
          "created_at",
          {
            ascending:
              false
          }
        ),

      db
        .from(
          "flashcards"
        )
        .select("*")
        .order(
          "created_at",
          {
            ascending:
              false
          }
        ),

      db
        .from(
          "daily_challenges"
        )
        .select("*")
        .order(
          "challenge_date",
          {
            ascending:
              false
          }
        ),

      db
        .from(
          "wwsef_projects"
        )
        .select("*")
        .order(
          "updated_at",
          {
            ascending:
              false
          }
        ),

      db
        .from(
          "project_teams"
        )
        .select("*")
        .order(
          "name",
          {
            ascending:
              true
          }
        ),

      db
        .from(
          "project_team_members"
        )
        .select("*")
        .order(
          "joined_at",
          {
            ascending:
              true
          }
        ),

      db
        .from(
          "notifications"
        )
        .select("*")
        .order(
          "created_at",
          {
            ascending:
              false
          }
        )

    ]);


  const results = [
    practiceResult,
    deckResult,
    cardResult,
    dailyResult,
    projectResult,
    teamResult,
    memberResult,
    notificationResult
  ];


  results.forEach(
    result => {

      if (
        result.error
      ) {
        console.error(
          result.error
        );
      }

    }
  );


  SC2.admin.practice =
    practiceResult.data ||
    [];


  SC2.admin.decks =
    deckResult.data ||
    [];


  SC2.admin.cards =
    cardResult.data ||
    [];


  SC2.admin.daily =
    dailyResult.data ||
    [];


  SC2.admin.projects =
    projectResult.data ||
    [];


  SC2.admin.teams =
    teamResult.data ||
    [];


  SC2.admin.members =
    memberResult.data ||
    [];


  SC2.admin.notifications =
    notificationResult.data ||
    [];


  sc2RenderAdmin();
}


function sc2AdminUsername(
  id
) {

  const profile =
    (adminProfiles || [])
      .find(
        item =>
          item.user_id ===
          id
      );


  return (
    profile?.username ||
    profile?.nickname ||
    "Unknown"
  );
}

async function sc2AdminToggle(
  table,
  id,
  publish
) {

  const {
    error
  } =
    await db
      .from(table)
      .update({
        is_published:
          publish
      })
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(error);

    msg(
      "adminMsg",
      "Could not update item.",
      "err"
    );

    return;
  }


  await sc2LoadAdmin();
}


async function sc2AdminDelete(
  table,
  id,
  label
) {

  if (
    !confirm(
      `Delete this ${label}?`
    )
  ) {
    return;
  }


  const {
    error
  } =
    await db
      .from(table)
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(error);

    msg(
      "adminMsg",
      `Could not delete ${label}.`,
      "err"
    );

    return;
  }


  await sc2LoadAdmin();
}

async function sc2AdminSendFeedback(
  event
) {

  event.preventDefault();


  const projectId =
    Number(
      document
        .getElementById(
          "sc2AdminFeedbackProject"
        )
        .value
    );


  const messageText =
    document
      .getElementById(
        "sc2AdminFeedbackMessage"
      )
      .value
      .trim();


  const project =
    SC2.admin.projects
      .find(
        item =>
          Number(
            item.id
          ) ===
          projectId
      );


  const {
    error
  } =
    await db
      .from(
        "project_feedback"
      )
      .insert({

        project_id:
          projectId,

        admin_id:
          currentUser.id,

        message:
          messageText

      });


  if (error) {

    console.error(error);

    msg(
      "adminMsg",
      "Could not send project feedback.",
      "err"
    );

    return;
  }


  let targets = [];


  if (
    project
      ?.owner_user_id
  ) {

    targets = [
      project.owner_user_id
    ];

  } else if (
    project
      ?.team_id
  ) {

    targets =
      SC2.admin.members
        .filter(
          member =>
            Number(
              member.team_id
            ) ===
            Number(
              project.team_id
            )
        )
        .map(
          member =>
            member.user_id
        );
  }


  if (
    targets.length
  ) {

    const rows =
      targets.map(
        userId => ({

          title:
            "New WWSEF Project Feedback",

          message:
            `Feedback was added to ${project.title}.`,

          category:
            "Feedback",

          target_user_id:
            userId,

          link_page:
            "sc2WWSEF",

          created_by:
            currentUser.id

        })
      );


    const result =
      await db
        .from(
          "notifications"
        )
        .insert(
          rows
        );


    if (
      result.error
    ) {
      console.error(
        result.error
      );
    }
  }


  event.target.reset();


  await sc2LoadAdmin();


  msg(
    "adminMsg",
    "Project feedback sent."
  );
}
